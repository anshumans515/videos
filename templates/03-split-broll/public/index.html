<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>split-broll</title>
<link rel="stylesheet" href="../../../assets/fonts/fonts.css" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage {
    position: relative; width: 1080px; height: 1920px;
    overflow: hidden; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  video#input-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .divider-inner {
    position: absolute; top: 0; left: 537px; width: 6px; height: 100%;
    background: #fff; box-shadow: 0 0 24px 4px #047857; opacity: 0;
  }

  .label-chip {
    position: absolute; top: 96px; padding: 10px 22px; border-radius: 999px;
    font-weight: 700; font-size: 26px; letter-spacing: 0.05em; color: #fff; opacity: 0;
  }
  .label-chip--left { left: 40px; background: #047857; }
  .label-chip--right { right: 40px; background: #F59E0B; }

  .hook-scrim {
    position: absolute; inset: 0; background: rgba(0,0,0,0.38); opacity: 0;
  }
  .hook-inner {
    position: absolute; left: 64px; right: 64px; top: 760px; text-align: center;
  }
  .hook-word {
    display: inline-block; margin: 0 0.16em; color: #fff; font-weight: 700; font-size: 66px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5); opacity: 0;
  }

  .counter-inner {
    position: absolute; left: 0; right: 0; top: 1180px; text-align: center; opacity: 0;
  }
  .counter-value { color: #fff; font-weight: 700; font-size: 88px; text-shadow: 0 2px 14px rgba(0,0,0,0.55); }
  .counter-label { color: rgba(255,255,255,0.9); font-weight: 400; font-size: 24px; margin-top: 4px; }
  .counter-note {
    color: rgba(255,255,255,0.65); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; margin-top: 8px;
  }

  .jar-inner {
    position: absolute; left: 0; right: 0; top: 1300px; display: flex; flex-direction: column;
    align-items: center; opacity: 0;
  }
  .jar-svg { width: 130px; height: auto; }
  .jar-fill-rect { fill: #34D399; }
  .jar-note {
    color: rgba(255,255,255,0.65); font-weight: 700; font-size: 14px; letter-spacing: 0.08em; margin-top: 6px;
  }

  .brand-mark-inner { position: absolute; top: 56px; right: 56px; width: 176px; opacity: 0; }
  .brand-mark-img { width: 100%; height: auto; filter: brightness(0) invert(1); }

  .compliance-inner { position: absolute; left: 0; right: 0; bottom: 44px; opacity: 0; }
  .compliance-scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 220px;
    background: linear-gradient(0deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0) 100%);
  }
  .compliance-text {
    position: relative; padding: 0 48px 26px; color: rgba(255,255,255,0.86);
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .compliance-line { font-weight: 500; font-size: 19px; line-height: 1.4; }
</style>
</head>
<body>
<div id="stage" data-composition-id="split-broll" data-start="0" data-duration="25.5"
     data-fps="30" data-width="1080" data-height="1920">

  <video id="input-video" class="clip" data-track-index="0" data-start="0" data-duration="25.5"
         src="input-video.mp4" muted playsinline></video>

  <div id="divider" class="clip" data-track-index="1" data-start="0" data-duration="25.5">
    <div class="divider-inner"></div>
  </div>

  <div id="label-left" class="clip" data-track-index="2" data-start="0" data-duration="25.5">
    <div class="label-chip label-chip--left">SAVER</div>
  </div>
  <div id="label-right" class="clip" data-track-index="3" data-start="0" data-duration="25.5">
    <div class="label-chip label-chip--right">SPENDER</div>
  </div>

  <div id="hook" class="clip" data-track-index="4" data-start="0.3" data-duration="2.9">
    <div class="hook-scrim"></div>
    <div class="hook-inner"><span class="hook-word">Same</span> <span class="hook-word">income.</span> <br/><span class="hook-word">Different</span> <span class="hook-word">habits.</span> <br/></div>
  </div>

  <div id="counter" class="clip" data-track-index="5" data-start="0.6" data-duration="24.9">
    <div class="counter-inner">
      <div class="counter-value" id="counter-value">0</div>
      <div class="counter-label">days of consistency</div>
      <div class="counter-note">ILLUSTRATIVE ONLY</div>
    </div>
  </div>

  <div id="jar" class="clip" data-track-index="6" data-start="0.6" data-duration="24.9">
    <div class="jar-inner">
      <svg viewBox="0 0 120 160" class="jar-svg">
        <clipPath id="jar-clip"><rect x="14" y="30" width="92" height="120" rx="10"/></clipPath>
        <rect class="jar-fill-rect" x="14" y="150" width="92" height="120" rx="10" clip-path="url(#jar-clip)"/>
        <rect x="14" y="30" width="92" height="120" rx="10" fill="none" stroke="#047857" stroke-width="4"/>
        <rect x="42" y="14" width="36" height="18" rx="4" fill="none" stroke="#047857" stroke-width="4"/>
      </svg>
      <div class="jar-note">illustrative</div>
    </div>
  </div>

  <div id="brand-mark" class="clip" data-track-index="7" data-start="0" data-duration="25.5">
    <div class="brand-mark-inner">
      <img src="../../../assets/prospur-logo.png" alt="Prospur" class="brand-mark-img" />
    </div>
  </div>

  <div id="compliance" class="clip" data-track-index="8" data-start="0" data-duration="25.5">
    <div class="compliance-inner">
      <div class="compliance-scrim"></div>
      <div class="compliance-text"><div class="compliance-line compliance-line--0">Prospur · AMFI-registered Mutual Fund Distributor · ARN-348873</div><div class="compliance-line compliance-line--1">Mutual funds are subject to market risks. Read all scheme-related documents carefully.</div><div class="compliance-line compliance-line--2">For information only, not investment advice.</div></div>
    </div>
  </div>

  <audio id="music-track" class="clip" data-track-index="10" data-start="0" data-duration="25.5"
         src="input-video.mp4"></audio>
</div>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  tl.fromTo('.divider-inner', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: 'power2.out', transformOrigin: 'center center' }, 0.1);
  tl.fromTo('.label-chip--left', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power2.out' }, 0.3);
  tl.fromTo('.label-chip--right', { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power2.out' }, 0.3);
  tl.fromTo('#hook .hook-scrim', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power1.out' }, 0.3);
  tl.fromTo('#hook .hook-word', { opacity: 0, y: 18, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'back.out(1.6)', stagger: 0.06 }, 0.4);
  tl.to('#hook .hook-scrim, #hook .hook-inner', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 2.9);
  tl.set('#hook .hook-scrim, #hook .hook-inner', { opacity: 0, visibility: 'hidden' }, 3.2);
  tl.fromTo('.counter-inner', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 1.0);
  (function(){ var c = { v: 0 }; tl.to(c, { v: 37, duration: 1.4, ease: 'power1.out', onUpdate: function () { document.getElementById('counter-value').textContent = Math.round(c.v); } }, 1.2); })();
  tl.fromTo('.jar-inner', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.out' }, 1.0);
  tl.to('.jar-fill-rect', { y: 66.0, duration: 1.6, ease: 'power2.inOut' }, 1.3);
  tl.fromTo('.brand-mark-inner', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.15);
  tl.fromTo('.compliance-inner', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.15);
  window.__timelines = window.__timelines || {};
  window.__timelines["split-broll"] = tl;
})();
</script>
</body>
</html>
